name: API dump (26.3)

# 개발용 임시 워크플로: 26.3 의 실제 클래스/메서드 이름(모장 이름)을 로그에 찍어서 포팅에 쓴다.
on:
  push:
    paths:
      - '.github/workflows/api-dump-26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Find Minecraft jars
        run: ./gradlew printMinecraftJars --no-daemon --no-configuration-cache -q | tee /tmp/mcjars.txt
      - name: Dump classes
        run: |
          CP=$(grep '^MCJAR ' /tmp/mcjars.txt | cut -d' ' -f2- | paste -sd:)
          CLASSES="
          net.minecraft.world.entity.Entity
          net.minecraft.world.entity.LivingEntity
          net.minecraft.world.phys.shapes.VoxelShape
          net.minecraft.server.level.ServerLevel
          net.minecraft.network.RegistryFriendlyByteBuf
          com.mojang.blaze3d.platform.InputConstants
          com.mojang.blaze3d.platform.InputConstants\$Type
          net.minecraft.world.entity.player.Input
          net.minecraft.client.model.player.PlayerModel
          net.minecraft.client.renderer.entity.player.AvatarRenderer
          net.minecraft.world.level.block.state.properties.BlockStateProperties
          "
          for c in $CLASSES; do
            echo "##### $c"
            javap -cp "$CP" -p "$c" 2>&1 | grep -v 'lambda\$' | grep -v '^Compiled from' || true
          done
