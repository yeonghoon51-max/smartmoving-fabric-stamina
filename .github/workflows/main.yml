name: Build SmartMoving Mod

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Print Gradle version info
        run: |
          echo "=== Trying Gradle 8.8 ==="

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build --no-daemon --console=plain --stacktrace 2>&1 | head -80

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoving-Fabric-${{ github.sha }}
          path: build/libs/SmartMoving-Fabric-*.jar
          if-no-files-found: error
          retention-days: 30
