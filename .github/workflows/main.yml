name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 마인크래프트 버전마다 독립된 Gradle 프로젝트(versions/<버전>)를 따로 빌드한다.
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.20.1'
            java: '21'
          - mc: '1.21.8'
            java: '21'
    name: build (${{ matrix.mc }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/${{ matrix.mc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: smartmoving-fabric-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error
