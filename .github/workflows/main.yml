name: Build SmartMoving Mod

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod (offline stub)
        run: gradle build -PuseStubDeps=true -DuseStubLoom=true --no-daemon --console=plain

      - name: List build output
        if: always()
        run: find build/libs -type f 2>/dev/null || echo "build/libs not found"

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoving-Fabric-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30
